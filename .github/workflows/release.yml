# CI 发布链（cicd C1~C4，演进自 S5 契约 #6 mac-only 版本）
# 触发：workflow_dispatch 手动（branch + version 三档 + release_notes），CON-R-cicd-003
# 三阶段（方案 A，修正 bump 先于 build 的实现偏离）：
#   build    → 读分支当前 version，三端 matrix 打包验证（--publish never，零污染）
#   release  → build 全成功后：打 tag v<当前version> + 建 GitHub Release + 上传各平台产物
#   bump     → 发布成功后：version +1（patch/minor/major）写回 package.json + commit + push
# 失败语义：build/release 任一失败 → 不 bump，main 版本线零污染，可无限重试
# GH_TOKEN：仓库 Secrets（fine-grained PAT，Contents+Actions 写权限，S5 契约已就绪）
# permissions: contents: write（bump push + 建 Release，最小化）
# 并发锁按版本线分组（CON-R-cicd-003/Q-058）：同 branch 发布串行，异 branch 并行
# Semgrep（CWE-1357）：actions pin 到完整 40 字符 commit SHA（防 mutable tag 供应链攻击）

name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 发布源分支（默认 main；维护线发布选 release/x.y）
        default: main
        required: true
      version:
        description: 版本档位（patch=bug+小功能 / minor=攒批 / major=破坏性重构）
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        required: true
      release_notes:
        description: 发布说明（可选，写入 GitHub Release body）
        default: ''

concurrency:
  group: release-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  # 阶段 1：读版本 + 三端 matrix 打包验证（--publish never，失败零污染）
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   platform: darwin-arm64, arch: arm64 }
          - { os: macos-latest,   platform: darwin-x64,   arch: x64 }   # Intel Mac：ARM runner 交叉编译（macos-13 已退役，决策 6/经验 8）
          - { os: windows-latest, platform: win32-x64,    arch: x64 }
          - { os: ubuntu-latest,  platform: linux-x64,    arch: x64 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled Node (C3，按平台生成；win32-x64 CI 补齐 Q-059)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/fetch-node.mjs --platform "$PLATFORM"

      - name: Typecheck (C7 前置门禁)
        run: npm run typecheck

      - name: Build (C7 前置门禁)
        run: npm run build

      - name: Setup mac signing keychain (自签名证书：导入≠受信，需显式 add-trusted-cert)
        if: startsWith(matrix.platform, 'darwin')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          P12="$RUNNER_TEMP/hull-signing.p12"
          CER="$RUNNER_TEMP/hull-signing.cer"
          KC="$RUNNER_TEMP/hull-signing.keychain"
          base64 -D -o "$P12" <<< "$CSC_LINK"
          security create-keychain -p hullci "$KC"
          # 新建 keychain 默认数分钟自动锁——Package 步（rebuild+下载 electron 数分钟后）才 codesign，
          # 锁住的 keychain 搜身份返回空 → codesign 报 "no identity found"（CI 实测）。拉到 6h 不自动锁
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p hullci "$KC"
          security import "$P12" -k "$KC" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k hullci "$KC" >/dev/null
          # 自签名证书自身即根：p12 导入只落证书+私钥，不带信任 → find-identity -v 全过滤
          # （CSSMERR_TP_NOT_TRUSTED，CI 实测）→ 必须显式加入受信根。
          # 证书导出用 security 不用 openssl pkcs12：该 p12 是 RC2-40-CBC 旧加密，
          # runner 的 OpenSSL 3.x 默认 provider 拒解（unsupported RC2-40-CBC，实测）
          security find-certificate -c "Dsh Hull Code Signing" -p "$KC" > "$CER"
          sudo security add-trusted-cert -d -r trustRoot "$CER"
          # codesign --sign 按名解析身份走 keychain search list（--keychain 参数不等价，
          # 实测 find-identity 列得到但 codesign 报 no identity found）→ 显式加入 search list
          security list-keychain -d user -s "$KC" $(security list-keychain -d user | tr -d '"')
          echo "--- 可用签名身份（断言 1 valid identities found）---"
          security find-identity -v -p codesigning "$KC"

      - name: Package (C3，打包当前 version，--publish never 零污染)
        env:
          # mac 签名：用 Setup 步准备好的受信 keychain。electron-builder 26 无 CSC_LINK 时走
          # CSC_KEYCHAIN 分支（macPackager codeSigningInfo），不自建临时 keychain——它 import p12
          # 不带信任，find-identity -v 过滤后 0 身份 → forceCodeSigning 门禁构建失败（v0.1.6 实测）。
          # win/linux 不读此变量；历史坑：v0.1.4/v0.1.5 连 CSC_LINK env 都没传 → 静默跳签发无签名包
          # （Squirrel.Mac 拒装更新 "Could not get code signature for running application"）。
          CSC_KEYCHAIN: ${{ runner.temp }}/hull-signing.keychain
        run: npx electron-builder --publish never --${{ matrix.arch }}

      - name: Verify mac code signature (发布门禁：产物必须带有效签名)
        if: startsWith(matrix.platform, 'darwin')
        run: |
          APP=$(find release -maxdepth 2 -type d -name "*.app" | head -1)
          test -n "$APP" || { echo "::error::未找到 .app 产物"; exit 1; }
          codesign --verify --deep --strict "$APP"
          echo "mac 签名校验通过: $APP"
          codesign -dvv "$APP" 2>&1 | sed -n '1,8p'

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 (node24)
        with:
          name: dist-${{ matrix.platform }}
          # ⚠️ 白名单 glob（修复 v0.1.4 垃圾资产污染）：release/* 会把解包 .app/win-unpacked/linux-unpacked/node 内容
          # 也传进 artifact → 发布时 200+ 垃圾文件混入 release。只传安装包/更新元数据/blockmap。
          path: |
            release/**/*.zip
            release/**/*.dmg
            release/**/*.exe
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.yml
            release/**/*.yaml
            release/**/*.blockmap
            !release/**/*unpacked*/**
            !release/**/*.app/**
          if-no-files-found: error

  # 阶段 2：build 全成功后打 tag + 建 Release + 上传各平台产物
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Read current version
        id: version
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download all platform artifacts
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v7 (node24)
        with:
          path: dist-artifacts
          # ⚠️ 不用 merge-multiple：mac arm64+x64 各自生成 latest-mac.yml（同名），merge 覆盖只剩一个架构
          # → 对端 electron-updater 按 process.arch 匹配不到 → "No files provided"。保留目录结构后合并。

      - name: Merge latest-mac.yml (dual-arch arm64+x64, 修复 No files provided)
        run: node scripts/merge-latest-mac.mjs dist-artifacts

      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "tag v${VERSION} 已存在，跳过创建"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Generate changelog (git log Conventional Commits)
        id: changelog
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          # 上 tag 到 HEAD 的提交 → 自动 changelog（feat/fix/refactor/docs 分组）
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          LOG=$(git log "$RANGE" --no-merges --pretty=format:'%s' 2>/dev/null | grep -E '^(feat|fix|refactor|docs|chore|perf|style|test)(\([^)]*\))?:' | grep -viE 'bump version|version .*→|version .*->' | head -30 || true)
          # 分组：feat → 新增，fix → 修复，其余 → 其他（支持 scope：fix(skills): …）
          FEATS=$(printf '%s\n' "$LOG" | grep -E '^feat(\([^)]*\))?:' | sed -E 's/^feat(\([^)]*\))?: *//' 2>/dev/null || true)
          FIXES=$(printf '%s\n' "$LOG" | grep -E '^fix(\([^)]*\))?:' | sed -E 's/^fix(\([^)]*\))?: *//' 2>/dev/null || true)
          OTHERS=$(printf '%s\n' "$LOG" | grep -vE '^(feat|fix)(\([^)]*\))?:' | sed -E 's/^[a-z]+(\([^)]*\))?: *//' | head -10 2>/dev/null || true)
          # 组装 changelog（多行）
          {
            echo "## 更新内容"
            if [ -n "$FEATS" ]; then
              echo "### ✨ 新增"
              printf '%s\n' "$FEATS" | sed 's/^/- /'
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 修复"
              printf '%s\n' "$FIXES" | sed 's/^/- /'
            fi
            if [ -n "$OTHERS" ]; then
              echo "### 🔧 其他"
              printf '%s\n' "$OTHERS" | sed 's/^/- /'
            fi
            if [ -z "$FEATS" ] && [ -z "$FIXES" ] && [ -z "$OTHERS" ]; then
              echo "- 无显著变更"
            fi
          } > /tmp/changelog-body.txt
          BODY=$(cat /tmp/changelog-body.txt)
          # ⚠️ $GITHUB_OUTPUT 多行值必须用 heredoc 格式（直接 echo "key=多行" 会报 Invalid format）
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release + upload assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 建 release（若已存在则复用）：notes = 手动说明（若有）+ 自动 changelog
          NOTES="${RELEASE_NOTES:-}

          ${CHANGELOG}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "release v${VERSION} 已存在，跳过创建"
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes "${NOTES}" || echo "release create skipped"
          fi
          # 只上传安装包/更新元数据（扩展名白名单，排除解包 .app/win-unpacked/linux-unpacked/node 目录内容）
          # 分批上传避免命令行超长（每批 ~50 文件）
          find dist-artifacts -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.exe' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.yml' -o -name '*.yaml' \
            -o -name '*.blockmap' \) ! -path '*unpacked*' ! -path '*.app/*' \
            -print0 | while IFS= read -r -d '' f; do
            gh release upload "v${VERSION}" "$f" --clobber || echo "upload failed: $f"
          done

      - name: Update release body (changelog + asset-driven platform status, Q-060)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ASSETS=$(gh release view "v${VERSION}" --json assets --jq '.assets[].name' 2>/dev/null || echo "")
          # 按真实资产存在性标注各平台（成功才发布资产）
          CHECK() { printf '%s' "$ASSETS" | grep -qi "$1" && echo "✅" || echo "❌"; }
          MAC_ARM=$(CHECK "arm64-mac.zip")
          # mac x64 交叉产物 = 独立 -mac.zip（无 arm64 前缀）：
          # 先取 .zip 结尾资产 → 排除 arm64-mac.zip → 剩余若有 -mac.zip 即 x64 存在
          MAC_X64=$(printf '%s\n' "$ASSETS" | grep -E '\.zip$' | grep -v 'arm64-mac\.zip$' | grep -qE 'mac\.zip$' && echo "✅" || echo "❌")
          WIN=$(CHECK "Setup.*exe\|portable.*exe" || CHECK "nsis")
          LINUX=$(CHECK "AppImage")
          # 合并：自动 changelog + 构建状态（不覆盖 changelog）
          gh release edit "v${VERSION}" --notes "${CHANGELOG}

          ## 构建状态（资产驱动）
          - macOS arm64: $MAC_ARM
          - macOS x64: $MAC_X64
          - Windows: $WIN
          - Linux: $LINUX
          " || echo "release edit skipped"

  # 阶段 3：发布成功后 version +1（bump 是事后动作，失败不执行 → 版本线零污染）
  bump:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Bump version (发布成功后才执行)
        env:
          BUMP: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch }}
        run: |
          NEXT=$(node scripts/bump-version.mjs --bump "$BUMP")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${NEXT} after release [skip ci]"
          git push origin "$BRANCH"
          echo "bumped to ${NEXT}"
