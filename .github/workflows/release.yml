# CI 发布链（cicd C1~C4，演进自 S5 契约 #6 mac-only 版本）
# 触发：workflow_dispatch 手动（branch + version 三档 + release_notes），CON-R-cicd-003
# 三阶段（方案 A，修正 bump 先于 build 的实现偏离）：
#   build    → 读分支当前 version，三端 matrix 打包验证（--publish never，零污染）
#   release  → build 全成功后：打 tag v<当前version> + 建 GitHub Release + 上传各平台产物
#   bump     → 发布成功后：version +1（patch/minor/major）写回 package.json + commit + push
# 失败语义：build/release 任一失败 → 不 bump，main 版本线零污染，可无限重试
# GH_TOKEN：仓库 Secrets（fine-grained PAT，Contents+Actions 写权限，S5 契约已就绪）
# permissions: contents: write（bump push + 建 Release，最小化）
# 并发锁按版本线分组（CON-R-cicd-003/Q-058）：同 branch 发布串行，异 branch 并行
# Semgrep（CWE-1357）：actions pin 到完整 40 字符 commit SHA（防 mutable tag 供应链攻击）

name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 发布源分支（默认 main；维护线发布选 release/x.y）
        default: main
        required: true
      version:
        description: 版本档位（patch=bug+小功能 / minor=攒批 / major=破坏性重构）
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        required: true
      release_notes:
        description: 发布说明（可选，写入 GitHub Release body）
        default: ''

concurrency:
  group: release-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  # 阶段 1：读版本 + 三端 matrix 打包验证（--publish never，失败零污染）
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   platform: darwin-arm64, arch: arm64 }
          - { os: macos-latest,   platform: darwin-x64,   arch: x64 }   # Intel Mac：ARM runner 交叉编译（macos-13 已退役，决策 6/经验 8）
          - { os: windows-latest, platform: win32-x64,    arch: x64 }
          - { os: ubuntu-latest,  platform: linux-x64,    arch: x64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled Node (C3，按平台生成；win32-x64 CI 补齐 Q-059)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/fetch-node.mjs --platform "$PLATFORM"

      - name: Typecheck (C7 前置门禁)
        run: npm run typecheck

      - name: Build (C7 前置门禁)
        run: npm run build

      - name: Package (C3，打包当前 version，--publish never 零污染)
        run: npx electron-builder --publish never --${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  # 阶段 2：build 全成功后打 tag + 建 Release + 上传各平台产物
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Read current version
        id: version
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "tag v${VERSION} 已存在，跳过创建"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Create GitHub Release + upload assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 建 release（若已存在则复用）
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "release v${VERSION} 已存在，跳过创建"
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes "${RELEASE_NOTES:-}" || echo "release create skipped"
          fi
          # 只上传文件（排除 linux-unpacked/ 等目录——gh release upload 不支持目录，撞上会中断整批）
          # 分批上传避免命令行超长（每批 ~50 文件）
          find dist-artifacts -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do
            gh release upload "v${VERSION}" "$f" --clobber || echo "upload failed: $f"
          done

      - name: Update release body (asset-driven platform status, Q-060)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ASSETS=$(gh release view "v${VERSION}" --json assets --jq '.assets[].name' 2>/dev/null || echo "")
          # 按真实资产存在性标注各平台（成功才发布资产）
          CHECK() { printf '%s' "$ASSETS" | grep -qi "$1" && echo "✅" || echo "❌"; }
          MAC_ARM=$(CHECK "arm64-mac.zip")
          # mac x64 交叉产物无 arch 后缀（-mac.zip）；arm64 有后缀（-arm64-mac.zip）→ 匹配 -mac.zip 且排除 arm64
          MAC_X64=$(printf '%s' "$ASSETS" | grep -qiE '(^|\s)-mac\.zip|[-_]mac\.zip' && echo "✅" || echo "❌")
          if [ "$MAC_X64" = "✅" ] && [ "$MAC_ARM" = "✅" ]; then
            # 若只有 arm64-mac.zip 而无独立 -mac.zip（非 arm64 后缀），x64 视为 ❌
            printf '%s' "$ASSETS" | grep -qiE '[^-]mac\.zip|[_-]mac\.zip$' || MAC_X64="❌"
          fi
          WIN=$(CHECK "Setup.*exe\|portable.*exe" || CHECK "nsis")
          LINUX=$(CHECK "AppImage")
          gh release edit "v${VERSION}" --notes "## 构建状态（资产驱动）
          - macOS arm64: $MAC_ARM
          - macOS x64: $MAC_X64
          - Windows: $WIN
          - Linux: $LINUX
          " || echo "release edit skipped"

  # 阶段 3：发布成功后 version +1（bump 是事后动作，失败不执行 → 版本线零污染）
  bump:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Bump version (发布成功后才执行)
        env:
          BUMP: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch }}
        run: |
          NEXT=$(node scripts/bump-version.mjs --bump "$BUMP")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${NEXT} after release [skip ci]"
          git push origin "$BRANCH"
          echo "bumped to ${NEXT}"
